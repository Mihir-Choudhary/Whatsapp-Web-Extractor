name: release
# Build standalone binaries with PyInstaller and attach them to a GitHub Release.
# Triggers on a version tag (v*), or manually. PyInstaller can't cross-compile, so the
# Windows .exe is built on a Windows runner and the Linux binary on an Ubuntu runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: wawf.exe
            asset: wawf-windows-x64.exe
          - os: ubuntu-latest
            out: wawf
            asset: wawf-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller                 # build-only (not a runtime dep)
          pip install -r requirements.txt
      # Baileys and libsignal-node, for the cross-implementation cases in the binary, signal and capture
      # self-tests (they compare our encoder, Signal sessions and group keys with the Node libraries).
      # Not bundled into the binaries. The lockfile names libsignal by a git+ssh URL; the runner has no
      # SSH key, so GitHub is reached over HTTPS.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Node libraries the cross-checks use
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --prefix tools/reconnect --no-audit --no-fund
      # Needs no profile, no network and no secrets, so it belongs in CI: these cover the parts
      # where a quiet mistake mislabels evidence instead of failing loudly.
      - name: Self-tests
        shell: bash
        env:
          WAWF_XTEST_REQUIRE: "1"                 # a cross-check skipped for want of Node fails the build
        run: |
          python scripts/selftest_identities.py
          python scripts/selftest_pipeline.py
          python scripts/selftest_firefox.py
          python scripts/selftest_history.py
          python scripts/selftest_anchors.py
          python scripts/selftest_mediacache.py
          python scripts/selftest_chromium.py
          python scripts/selftest_gui.py
          python scripts/selftest_binary.py
          python scripts/selftest_signal.py
          python scripts/selftest_capture.py
          python scripts/selftest_scope.py
      - name: Build
        run: pyinstaller wawf.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: cp "dist/${{ matrix.out }}" "${{ matrix.asset }}"
      - name: Smoke test
        shell: bash
        run: ./${{ matrix.asset }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
